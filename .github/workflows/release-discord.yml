# Posts a published release to the Discord announcements channel.
#
# As the server's bot (preferred): the repository secret DISCORD_BOT_TOKEN and the repository variable
# DISCORD_ANNOUNCE_CHANNEL (the channel's ID). The bot needs View Channel, Send Messages and Embed Links there; in an
# Announcement channel it also publishes the post to following servers, which needs Manage Messages.
# Otherwise through a webhook: the repository secret DISCORD_RELEASE_WEBHOOK.
# The Version Pings role's ID is the repository variable DISCORD_PING_ROLE; without it the post pings nobody.
# (Settings > Secrets and variables > Actions: secrets on the Secrets tab, variables on the Variables tab.)
#
# The post: a line with the version and the download link, then the release notes as an embed in LBPPC's lime.
name: Release announcement

on:
  release:
    types: [published]

jobs:
  discord:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL: ${{ vars.DISCORD_ANNOUNCE_CHANNEL }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          ROLE: ${{ vars.DISCORD_PING_ROLE }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
        run: |
          # Discord allows 4096 characters in an embed's description; longer notes end with a link to the rest.
          notes=$(printf '%s' "$BODY" | head -c 3800)
          if [ "${#BODY}" -gt 3800 ]; then notes="$notes"$'\n\n'"[Read the full release notes]($URL)"; fi
          # allowed_mentions: only the Version Pings role can be pinged, never @everyone or anyone named in the notes.
          jq -n --arg tag "$TAG" --arg name "${NAME:-LBPPC $TAG}" --arg url "$URL" --arg notes "$notes" \
                --arg role "$ROLE" '{
            content: ((if $role != "" then "<@&" + $role + "> " else "" end)
                      + "**LBPPC " + $tag + " is out!** Download it from the website or GitHub: <https://lbppc.com/download>"),
            allowed_mentions: { parse: [], roles: (if $role != "" then [$role] else [] end) },
            embeds: [{
              title: $name,
              url: $url,
              description: $notes,
              color: 10539590,
              thumbnail: { url: "https://lbppc.com/assets/apple-touch-icon.png?v=6" },
              footer: { text: "You need your own copy of LittleBigPlanet 3. LBPPC includes no game files." }
            }]
          }' > message.json

          if [ -n "$BOT_TOKEN" ] && [ -n "$CHANNEL" ]; then
            # As the bot: its own name and picture.
            api="https://discord.com/api/v10/channels/$CHANNEL/messages"
            curl -sS --fail-with-body -H "Authorization: Bot $BOT_TOKEN" -H 'Content-Type: application/json' \
                 -d @message.json "$api" > sent.json
            id=$(jq -r .id sent.json)
            # Publish to servers following the channel; only possible (and only needed) in an Announcement channel.
            curl -sS -o /dev/null -w 'crosspost: %{http_code}\n' -X POST -H "Authorization: Bot $BOT_TOKEN" \
                 "$api/$id/crosspost" || true
          elif [ -n "$WEBHOOK" ]; then
            jq '. + {username: "LBPPC", avatar_url: "https://lbppc.com/assets/apple-touch-icon.png?v=6"}' \
               message.json > webhook.json
            curl -sS --fail-with-body -H 'Content-Type: application/json' -d @webhook.json "$WEBHOOK"
          else
            echo "No DISCORD_BOT_TOKEN and DISCORD_ANNOUNCE_CHANNEL, nor DISCORD_RELEASE_WEBHOOK: nothing posted." >&2
            exit 1
          fi
